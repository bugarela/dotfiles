[package]
name = "note-taker-gui"
version = "0.1.0"
description = "A cute GUI front-end for the note-taker transcription CLI"
authors = ["Gabriela Moreira <gabriela@informal.systems>"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync"] }
nix = { version = "0.29", features = ["signal"] }
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }

[features]
# By default Tauri uses a custom protocol; nothing extra needed here.
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
